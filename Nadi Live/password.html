<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change password · Nadi Investment</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    .th { --bg:#0D0F10; --sf:#15181B; --bd:#262B30; --tx:#F1F4F2; --mt:#A1AAA4; --ac:#34C267; --act:#08140C; --up:#3DD68C; --dn:#FF6B6B; --in:#0F1113; }
    .th.light { --bg:#F3F7F4; --sf:#FFFFFF; --bd:#DFE7E1; --tx:#0F1712; --mt:#56625B; --ac:#178A3E; --act:#FFFFFF; --up:#13804A; --dn:#C62828; --in:#FFFFFF; }
    .th { font-family:'Plus Jakarta Sans', sans-serif; background:var(--bg); color:var(--tx);
          min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
    .box { background:var(--sf); border:1px solid var(--bd); border-radius:16px; padding:32px; width:100%; max-width:420px; box-sizing:border-box; }
    h1 { margin:0 0 6px; font-size:24px; }
    .muted { color:var(--mt); font-size:14px; margin:0 0 22px; line-height:1.5; }
    label { display:block; font-size:14px; font-weight:600; margin-bottom:16px; }
    input { display:block; width:100%; box-sizing:border-box; margin-top:6px; padding:12px 14px; font:inherit;
            background:var(--in); color:var(--tx); border:1px solid var(--bd); border-radius:10px; }
    button { width:100%; padding:14px; font:inherit; font-weight:800; border:none; border-radius:12px; background:var(--ac); color:var(--act); cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .msg { margin-top:16px; font-size:14px; min-height:20px; font-weight:600; }
    .ok { color:var(--up); } .err { color:var(--dn); }
    a { color:var(--ac); }
  </style>
</head>
<body>
<div id="page" class="th">
  <div class="box">
    <h1>Change your password</h1>
    <p class="muted" id="who">Choose a new password with at least 8 characters.</p>

    <form id="pwForm">
      <label>New password
        <input type="password" id="pw1" required minlength="8" autocomplete="new-password">
      </label>
      <label>Type it again
        <input type="password" id="pw2" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit" id="pwBtn">Save new password</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <p class="muted" style="margin:16px 0 0"><a href="dashboard.html">← Back to my dashboard</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>

<script>
  setupTheme();
  const msg = document.getElementById("msg");

  // Must be logged in to change the password
  db.auth.getSession().then(function ({ data }) {
    if (!data.session) { window.location.href = "login.html"; return; }
    document.getElementById("who").textContent = "Logged in as " + data.session.user.email + ". Choose a new password with at least 8 characters.";
  });

  document.getElementById("pwForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;
    if (pw1 !== pw2) { msg.textContent = "The two passwords don't match."; msg.className = "msg err"; return; }

    const btn = document.getElementById("pwBtn");
    btn.disabled = true;
    const { error } = await db.auth.updateUser({ password: pw1 });
    btn.disabled = false;

    if (error) { msg.textContent = "Error: " + error.message; msg.className = "msg err"; return; }
    msg.textContent = "✓ Password changed. Use the new one next time you log in.";
    msg.className = "msg ok";
    document.getElementById("pwForm").reset();
  });
</script>
</body>
</html>
